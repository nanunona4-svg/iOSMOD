            box-sizing: border-box;
            width: 240px !important;
        }

        .item {
            display: block !important;
            clear: both;
            padding: 12px 3px;
            border-bottom: 1px solid #f0f0f0;
            height: 44px; 
            box-sizing: border-box;
        }

        .item .title-text {
            float: left;
            font-size: 14px;
            font-weight: bold;
            line-height: 20px;
            width: 120px;
 white-space: nowrap;
 overflow: hidden;
 text-overflow: ellipsis;
        }

        .switch {
            float: right;
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
            cursor: pointer;
            border: 2px solid #000000; 
            border-radius: 12px;
            background-color: #555555; 
            box-sizing: border-box;
            margin-top: 0px;
        }

        .switch-label input {
            position: absolute;
            opacity: 0 !important;
            width: 0 !important;
            height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            z-index: -1;
        }

        .slider-circle {
            position: absolute;
            top: 1px;
            left: 1px;
            width: 18px;
            height: 18px;
            background-color: #ffffff;
            border: 2px solid #000000;
            border-radius: 50%;
            box-sizing: border-box;
            transition: left 0.2s, background-color 0.2s;
            -webkit-transition: left 0.2s, background-color 0.2s;
        }

        input:checked + .switch {
            background-color: #00d2ff;
        }

        input:checked + .switch .slider-circle {
            left: 21px;
        }

        .ft {
            height: 50px;
            background: #ffffff;
            border-top: 1px solid rgba(255,255,255,0.2);
            box-sizing: border-box;
            padding-top: 5px;
            display:flex;justify-content:space-around;align-items:center;
        }

        .ft-btn {
            color:#3da5ff !important;
            font-weight:bold!important;
            font-size:15px!important;
            text-decoration:none!important;
            background:none!important;
            border:none!important;
            text-shadow:0 0 2px #000;
            cursor: pointer;
        }
        .ft-btn:hover{opacity:.85;}
        .ft-btn:active { opacity: 0.6; }

<style>
input[type="checkbox"], .switch, .toggle, .slider{
    accent-color:#00c853 !important;
}
.slider,.toggle,.switch{
    transition:background-color .2s ease,color .2s ease,border-color .2s ease !important;
}
.on,.enabled,.active{
    background:#00c853 !important;
    border-color:#00c853 !important;
}

<body>
<div class="box">
<div class="hd">ぷにMOD メメニュー</div>
<div class="ct">
<div class="item"><span class="title-text">ワンパン</span><label class="switch-label"><input id="one" onchange="toggleHack('one')" type="checkbox"/><span class="switch"><span class="slider-circle"></span></span></label></div>
<div class="item"><span class="title-text">倍速</span><label class="switch-label"><input id="spd" onchange="toggleHack('spd')" type="checkbox"/><span class="switch"><span class="slider-circle"></span></span></label></div>
<div class="item"><span class="title-text">遅延</span><label class="switch-label"><input id="dly" onchange="toggleHack('dly')" type="checkbox"/><span class="switch"><span class="slider-circle"></span></span></label></div>
<div class="item"><span class="title-text">無敵</span><label class="switch-label"><input id="mtk" onchange="toggleHack('mtk')" type="checkbox"/><span class="switch"><span class="slider-circle"></span></span></label></div>
<div class="item"><span class="title-text">スコア</span><label class="switch-label"><input id="scr" onchange="toggleHack('scr')" type="checkbox"/><span class="switch"><span class="slider-circle"></span></span></label></div>
<div class="item"><span class="title-text">ダメージ100万</span><label class="switch-label"><input id="dmg" onchange="toggleHack('dmg')" type="checkbox"/><span class="switch"><span class="slider-circle"></span></span></label></div>
<div class="item"><span class="title-text">リザルトスキップ</span><label class="switch-label"><input id="skp" onchange="toggleHack('skp')" type="checkbox"/><span class="switch"><span class="slider-circle"></span></span></label></div>
<div class="item"><span class="title-text">妖怪泥無効</span><label class="switch-label"><input id="ndr" onchange="toggleHack('ndr')" type="checkbox"/><span class="switch"><span class="slider-circle"></span></span></label></div>
<div class="item"><span class="title-text">即技</span><label class="switch-label"><input id="wz" onchange="toggleHack('wz')" type="checkbox"/><span class="switch"><span class="slider-circle"></span></span></label></div>
<div class="item"><span class="title-text">ぷにサイズ</span><label class="switch-label"><input id="sz" onchange="toggleHack('sz')" type="checkbox"/><span class="switch"><span class="slider-circle"></span></span></label></div>
<div class="item"><span class="title-text">ぷに1色</span><label class="switch-label"><input id="clr" onchange="toggleHack('clr')" type="checkbox"/><span class="switch"><span class="slider-circle"></span></span></label></div>
<div class="item"><span class="title-text">敵ターン無効</span><label class="switch-label"><input id="trn" onchange="toggleHack('trn')" type="checkbox"/><span class="switch"><span class="slider-circle"></span></span></label></div>
<div class="item"><span class="title-text">即フィーバー</span><label class="switch-label"><input id="fvr" onchange="toggleHack('fvr')" type="checkbox"/><span class="switch"><span class="slider-circle"></span></span></label></div>
<div class="item"><span class="title-text">鍵泥演出無効</span><label class="switch-label"><input id="key" onchange="toggleHack('key')" type="checkbox"/><span class="switch"><span class="slider-circle"></span></span></label></div>
<div class="item"><span class="title-text">即勝利</span><label class="switch-label"><input id="win" onchange="toggleHack('win')" type="checkbox"/><span class="switch"><span class="slider-circle"></span></span></label></div>
<div class="item"><span class="title-text">メニュー状態を保存</span><label class="switch-label"><input id="save" onchange="toggleSaveSetting()" type="checkbox"/><span class="switch"><span class="slider-circle"></span></span></label></div>
<div style="text-align:center;background:#0b63d1;padding:8px;"><a href="https://discord.gg/tC92h7ydA8" style="color:#fff;text-decoration:none;font-weight:bold;" target="_blank">my Discord Server</a></div>
<div style="display:flex;justify-content:space-between;padding:8px 12px;background:#0b63d1;"><a href="javascript:void(0)" onclick="clickLogout()" style="color:white;text-decoration:none;font-weight:bold;">ログアウト</a><a href="javascript:void(0)" onclick="clickAppEnd()" style="color:white;text-decoration:none;font-weight:bold;">アプリ終了</a></div>
</div>
</div>
<script>
    document.oncontextmenu = function () {
        return false;
    };

    // --- 各機能のオフセット・バイトコード設定用オブジェクト ---
    // ここにご自身の環境に応じた「オフセット」や「バイトコード」を入力してください。
    // 例: "one" (ワンパン) の行を書き換えるだけで適用されます。
    const hackConfig = {
        "one": { fpath: "自分専用IPA名", addr: 0x100000, bytes: "バイトコード" }, // ワンパン
        "spd": { fpath: "自分専用IPA名", addr: 0x0,      bytes: "" }, // 倍速
        "dly": { fpath: "自分専用IPA名", addr: 0x0,      bytes: "" }, // 遅延
        "mtk": { fpath: "自分専用IPA名", addr: 0x0,      bytes: "" }, // 無敵
        "scr": { fpath: "自分専用IPA名", addr: 0x0,      bytes: "" }, // スコア
        "dmg": { fpath: "自分専用IPA名", addr: 0x0,      bytes: "" }, // ダメージ100万
        "skp": { fpath: "自分専用IPA名", addr: 0x0,      bytes: "" }, // リザルトスキップ
        "ndr": { fpath: "自分専用IPA名", addr: 0x0,      bytes: "" }, // 妖怪泥無効
        "wz":  { fpath: "自分専用IPA名", addr: 0x0,      bytes: "" }, // 即技
        "sz":  { fpath: "自分専用IPA名", addr: 0x0,      bytes: "" }, // ぷにサイズ
        "clr": { fpath: "自分専用IPA名", addr: 0x0,      bytes: "" }, // ぷに1色
        "trn": { fpath: "自分専用IPA名", addr: 0x0,      bytes: "" }, // 敵ターン無効
        "fvr": { fpath: "自分専用IPA名", addr: 0x0,      bytes: "" }, // 即フィーバー
        "key": { fpath: "自分専用IPA名", addr: 0x0,      bytes: "" }, // 鍵泥演出無効
        "win": { fpath: "自分専用IPA名", addr: 0x0,      bytes: "" }  // 即勝利
    };

    const list = Object.keys(hackConfig);

    // 共通のハック切り替え処理
    function toggleHack(id) {
        var checkbox = document.getElementById(id);
        if (!checkbox) return;

        // h5frida が存在しない場合の処理
        if (typeof h5frida === 'undefined') {
            alert("専用ipaじゃありません。");
            checkbox.checked = !checkbox.checked; // チェックを元に戻す
            return;
        }

        var config = hackConfig[id];
        if (!config || !config.fpath || config.addr === 0x0) {
            console.log(id + " の設定またはオフセットが未設定です。");
            return;
        }

        // コードパッチの有効・無効化
        if (checkbox.checked) {
            ActiveCodePatch(config.fpath, config.addr, config.bytes);
        } else {
            DeactiveCodePatch(config.fpath, config.addr, config.bytes);
        }

        // 「メニュー状態を保存」スイッチがオンの時のみ状態を保存する
        var isSaveEnabled = localStorage.getItem("save_setting_enabled") === "true";
        if (isSaveEnabled) {
            localStorage.setItem(id, checkbox.checked ? "true" : "false");
        }
    }

    // 「メニュー状態を保存」スイッチのオンオフ切り替え処理
    function toggleSaveSetting() {
        var saveCheckbox = document.getElementById("save");
        if (!saveCheckbox) return;

        // 保存スイッチ自体の状態を記録
        localStorage.setItem("save_setting_enabled", saveCheckbox.checked ? "true" : "false");

        if (saveCheckbox.checked) {
            // 保存がオンになった瞬間、現在のすべてのスイッチの状態を記録
            list.forEach(function(id) {
                var cb = document.getElementById(id);
                if (cb) {
                    localStorage.setItem(id, cb.checked ? "true" : "false");
                }
            });
        } else {
            // 保存がオフになった瞬間、過去に保存されたデータをすべて削除（初期化）
            list.forEach(function(id) {
                localStorage.removeItem(id);
            });
        }
    }

    function clickLogout() {
        try {
            if (typeof h5gg !== 'undefined' && h5gg.loadPlugin) {
                const kt74v = h5gg.loadPlugin("YWPLOGOUT", "logout.dylib");
                kt74v.logout();

                setTimeout(function() {
                    try {
                        const end = h5gg.loadPlugin("AppEND", "AppEND.dylib");
                        end.append();
                    } catch (e) {}
                }, 300);
            }
        } catch (e) {}
    }

    function clickAppEnd() {
        try {
            if (typeof h5gg !== 'undefined' && h5gg.loadPlugin) {
                const end = h5gg.loadPlugin("AppEND", "AppEND.dylib");
                end.append();
            }
        } catch (e) {}
    }

    window.onload = function() {
        // 「メニュー状態を保存」スイッチの状態を復元
        var isSaveEnabled = localStorage.getItem("save_setting_enabled") === "true";
        var saveCheckbox = document.getElementById("save");
        if (saveCheckbox) {
            saveCheckbox.checked = isSaveEnabled;
        }

        // 保存スイッチがONの場合のみ、過去のON/OFF状態を復元して自動パッチ
        if (isSaveEnabled) {
            list.forEach(function(id) {
                var saved = localStorage.getItem(id);
                if (saved === "true") {
                    var checkbox = document.getElementById(id);
                    if (checkbox) {
                        checkbox.checked = true;
                        
                        // ロード直後の自動パッチ適用（h5fridaの読み込み待ちを考慮して500ms遅延）
                        setTimeout(function() {
                            if (typeof h5frida !== 'undefined') {
                                var config = hackConfig[id];
                                if (config && config.fpath && config.addr !== 0x0) {
                                    ActiveCodePatch(config.fpath, config.addr, config.bytes);
                                }
                            }
                        }, 500);
                    }
                }
            });
        }

        setWindowRect(10, 80, 240, 400);
        setWindowDrag(0, 0, 240, 50);

        setTimeout(function() {
            if (typeof setWindowTouchMode === 'function') {
                setWindowTouchMode(1);
            } else if (typeof h5gg !== 'undefined' && h5gg.setWindowTouch) {
                h5gg.setWindowTouch(false);
            }
        }, 100);
    };
</script>
</body>
</html>
